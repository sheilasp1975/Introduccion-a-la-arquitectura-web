<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 08 – Área de un Triángulo</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0a1e;
      --card: #160e2a;
      --border: #251840;
      --accent: #e879f9;
      --accent2: #a21caf;
      --text: #fdf4ff;
      --muted: #7c5a8a;
      --font-mono: 'Space Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font-mono);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 480px;
    }
    .tag {
      font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent); border: 1px solid var(--accent);
      display: inline-block; padding: 0.2em 0.7em; border-radius: 4px; margin-bottom: 1rem;
    }
    h1 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 0.4rem; }
    .subtitle { color: var(--muted); font-size: 0.78rem; margin-bottom: 1.5rem; line-height: 1.6; }

    .triangulo-svg {
      display: flex; justify-content: center; margin-bottom: 1.5rem;
    }

    .formula {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.6rem 1rem; text-align: center; font-size: 0.85rem;
      color: var(--accent); margin-bottom: 1.5rem;
    }

    .inputs-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1.2rem;
    }
    .input-group label {
      display: block; font-size: 0.65rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem;
    }
    .input-group input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem 0.8rem; color: var(--text);
      font-family: var(--font-mono); font-size: 0.95rem; outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: var(--accent); }

    button {
      width: 100%; background: var(--accent); color: #0f0a1e;
      border: none; border-radius: 8px; padding: 0.85rem;
      font-family: var(--font-display); font-size: 1rem; font-weight: 800;
      cursor: pointer; transition: opacity 0.15s, transform 0.15s;
    }
    button:hover { opacity: 0.85; transform: translateY(-1px); }

    .result { margin-top: 1.5rem; display: none; animation: fadeIn 0.35s ease; }
    .result.show { display: block; }

    .area-display {
      background: rgba(232,121,249,0.08); border: 1px solid rgba(232,121,249,0.25);
      border-radius: 12px; padding: 1.5rem; text-align: center;
    }
    .area-display .label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .area-display .big { font-family: var(--font-display); font-size: 2.8rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .area-display .unit { font-size: 0.9rem; color: var(--muted); margin-top: 0.3rem; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">Ejercicio 08</span>
    <h1>Área de un<br>Triángulo</h1>
    <p class="subtitle">Calcula el área de un triángulo con base y altura conocidas.</p>

    <div class="triangulo-svg">
      <svg width="160" height="100" viewBox="0 0 160 100">
        <polygon points="80,5 5,95 155,95" fill="rgba(232,121,249,0.08)" stroke="#e879f9" stroke-width="1.5"/>
        <!-- altura -->
        <line x1="80" y1="5" x2="80" y2="95" stroke="#e879f9" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
        <text x="85" y="55" fill="#e879f9" font-size="11" font-family="Space Mono">h</text>
        <!-- base -->
        <text x="68" y="108" fill="#e879f9" font-size="11" font-family="Space Mono">b</text>
      </svg>
    </div>

    <div class="formula">Área = (base × altura) / 2</div>

    <div class="inputs-grid">
      <div class="input-group">
        <label>Base (b)</label>
        <input type="number" id="base" min="0" placeholder="Ej: 10" />
      </div>
      <div class="input-group">
        <label>Altura (h)</label>
        <input type="number" id="altura" min="0" placeholder="Ej: 6" />
      </div>
    </div>

    <button onclick="calcular()">Calcular Área</button>

    <div class="result" id="resultado">
      <div class="area-display">
        <div class="label">Área del Triángulo</div>
        <div class="big" id="area">—</div>
        <div class="unit">unidades²</div>
      </div>
    </div>
  </div>

  <script>
    function calcular() {
      const b = parseFloat(document.getElementById('base').value);
      const h = parseFloat(document.getElementById('altura').value);

      if (isNaN(b) || isNaN(h) || b <= 0 || h <= 0) {
        alert('Ingresa valores válidos mayores que 0.');
        return;
      }

      const area = (b * h) / 2;
      document.getElementById('area').textContent = area.toFixed(2);
      document.getElementById('resultado').className = 'result show';
    }
  </script>
</body>
</html>
