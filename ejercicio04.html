<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 04 – Mayor de Edad</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0a1a;
      --card: #170f2a;
      --border: #2d1f4a;
      --accent: #a78bfa;
      --accent2: #f472b6;
      --text: #ede9fe;
      --muted: #7c6fa0;
      --font-mono: 'Space Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image: radial-gradient(circle at 50% 0%, #1d1040 0%, transparent 60%);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
    }
    .tag {
      font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent); border: 1px solid var(--accent);
      display: inline-block; padding: 0.2em 0.7em; border-radius: 4px; margin-bottom: 1rem;
    }
    h1 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 0.4rem; }
    .subtitle { color: var(--muted); font-size: 0.78rem; margin-bottom: 2rem; line-height: 1.6; }

    label {
      display: block; font-size: 0.68rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem;
    }

    input[type="number"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.8rem 1rem; color: var(--text);
      font-family: var(--font-mono); font-size: 1rem; outline: none;
      transition: border-color 0.2s; margin-bottom: 1.2rem;
    }
    input[type="number"]:focus { border-color: var(--accent); }

    button {
      width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border: none; border-radius: 8px; padding: 0.85rem;
      font-family: var(--font-display); font-size: 1rem; font-weight: 800;
      cursor: pointer; transition: opacity 0.15s, transform 0.15s;
    }
    button:hover { opacity: 0.85; transform: translateY(-1px); }

    .result {
      margin-top: 1.5rem; display: none; animation: fadeIn 0.35s ease;
      border-radius: 12px; padding: 1.5rem; text-align: center;
    }
    .result.show { display: block; }
    .result.mayor { background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.3); }
    .result.menor { background: rgba(244,114,182,0.1); border: 1px solid rgba(244,114,182,0.3); }

    .result .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .result .titulo { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }
    .result .detalle { color: var(--muted); font-size: 0.78rem; margin-top: 0.4rem; }

    .barra-contenedor {
      background: var(--bg); border-radius: 999px; height: 8px; margin: 1rem 0 0.3rem;
      overflow: hidden; border: 1px solid var(--border);
    }
    .barra {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.6s ease;
    }
    .barra-labels { display: flex; justify-content: space-between; font-size: 0.6rem; color: var(--muted); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">Ejercicio 04</span>
    <h1>¿Mayor<br>de Edad?</h1>
    <p class="subtitle">Ingresa la edad para determinar si la persona es mayor o menor de edad.</p>

    <label for="edad">Edad (años)</label>
    <input type="number" id="edad" min="0" max="120" placeholder="Ej: 17, 18, 25..." />

    <button onclick="verificar()">Verificar</button>

    <div class="result" id="resultado">
      <div class="icon" id="icon"></div>
      <div class="titulo" id="titulo"></div>
      <div class="detalle" id="detalle"></div>
      <div class="barra-contenedor">
        <div class="barra" id="barra"></div>
      </div>
      <div class="barra-labels"><span>0</span><span>18 años</span><span>100+</span></div>
    </div>
  </div>

  <script>
    function verificar() {
      const edad = parseInt(document.getElementById('edad').value);
      const res = document.getElementById('resultado');

      if (isNaN(edad) || edad < 0) { alert('Ingresa una edad válida.'); return; }

      const esMayor = edad >= 18;
      const porcentaje = Math.min((edad / 100) * 100, 100);

      res.className = 'result show ' + (esMayor ? 'mayor' : 'menor');
      document.getElementById('icon').textContent = esMayor ? '✅' : '🔞';
      document.getElementById('titulo').textContent = esMayor ? 'Mayor de edad' : 'Menor de edad';
      document.getElementById('detalle').textContent =
        esMayor
          ? `Con ${edad} años, ya puede ejercer sus derechos ciudadanos.`
          : `Con ${edad} años, aún faltan ${18 - edad} año(s) para ser mayor de edad.`;
      document.getElementById('barra').style.width = porcentaje + '%';
    }

    document.getElementById('edad').addEventListener('keydown', e => {
      if (e.key === 'Enter') verificar();
    });
  </script>
</body>
</html>
