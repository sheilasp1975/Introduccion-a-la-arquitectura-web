<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 01 – Positivo, Negativo o Cero</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e14;
      --card: #16161f;
      --border: #2a2a3d;
      --accent: #7fff6e;
      --accent2: #ff6eb4;
      --accent3: #6ebaff;
      --text: #e8e8f0;
      --muted: #6b6b85;
      --font-mono: 'Space Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image: radial-gradient(circle at 20% 20%, #1a1a2e 0%, transparent 60%),
                        radial-gradient(circle at 80% 80%, #0d1117 0%, transparent 60%);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 60px rgba(127,255,110,0.04);
    }

    .tag {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      display: inline-block;
      padding: 0.2em 0.7em;
      border-radius: 4px;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 1.2rem;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;
      background: var(--accent);
      color: #0e0e14;
      border: none;
      border-radius: 8px;
      padding: 0.85rem;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.15s, transform 0.15s;
    }

    button:hover { opacity: 0.88; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .result {
      margin-top: 1.5rem;
      padding: 1rem 1.2rem;
      border-radius: 10px;
      border-left: 4px solid var(--accent);
      background: rgba(127,255,110,0.06);
      font-size: 1rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .result.show { display: block; }
    .result.negativo { border-color: var(--accent2); background: rgba(255,110,180,0.06); }
    .result.cero { border-color: var(--accent3); background: rgba(110,186,255,0.06); }

    .result .emoji { font-size: 1.4rem; margin-right: 0.4rem; }
    .result .label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.3rem; }
    .result .value { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">Ejercicio 01</span>
    <h1>Positivo,<br>Negativo o Cero</h1>
    <p class="subtitle">Ingresa un número y el programa determinará su signo automáticamente.</p>

    <label for="numero">Número</label>
    <input type="number" id="numero" placeholder="Ej: -7, 0, 42" />

    <button onclick="verificar()">Verificar</button>

    <div class="result" id="resultado">
      <div class="label">Resultado</div>
      <div class="value" id="textoResultado"></div>
    </div>
  </div>

  <script>
    function verificar() {
      const n = parseFloat(document.getElementById('numero').value);
      const res = document.getElementById('resultado');
      const texto = document.getElementById('textoResultado');

      if (isNaN(n)) {
        res.className = 'result show cero';
        texto.innerHTML = '⚠️ Ingresa un número válido';
        return;
      }

      res.classList.remove('negativo', 'cero');
      res.className = 'result show';

      if (n > 0) {
        texto.innerHTML = '✅ El número ' + n + ' es <strong>Positivo</strong>';
      } else if (n < 0) {
        res.classList.add('negativo');
        texto.innerHTML = '🔴 El número ' + n + ' es <strong>Negativo</strong>';
      } else {
        res.classList.add('cero');
        texto.innerHTML = '⭕ El número es <strong>Cero</strong>';
      }
    }

    document.getElementById('numero').addEventListener('keydown', e => {
      if (e.key === 'Enter') verificar();
    });
  </script>
</body>
</html>
