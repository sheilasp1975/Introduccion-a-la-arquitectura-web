<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rellena tu CV</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 30px;
      color: #000;
    }

    h1 {
      color: #2244aa;
      font-size: 1.6rem;
      margin-bottom: 20px;
      border-left: 4px solid #2244aa;
      padding-left: 10px;
    }

    form {
      max-width: 680px;
    }

    /* ── FIELDSET ── */
    fieldset {
      border: 1px solid #888;
      padding: 16px 20px 20px;
      margin-bottom: 20px;
      background-color: #fff;
    }

    legend {
      font-size: 0.9rem;
      color: #333;
      padding: 0 6px;
    }

    /* ── ETIQUETAS ── */
    label.titulo {
      display: block;
      font-size: 0.95rem;
      font-weight: normal;
      margin-top: 12px;
      margin-bottom: 4px;
      color: #000;
    }

    /* ── SELECT provincia ── */
    select.provincia {
      padding: 3px 6px;
      font-size: 0.88rem;
      border: 1px solid #aaa;
      min-width: 140px;
    }

    /* ── FECHA ── */
    .fecha-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .fecha-row input[type="text"] {
      width: 45px;
      padding: 3px 5px;
      border: 1px solid #aaa;
      font-size: 0.88rem;
      text-align: center;
    }

    .fecha-row select {
      padding: 3px 6px;
      font-size: 0.88rem;
      border: 1px solid #aaa;
    }

    .fecha-row span {
      font-size: 0.88rem;
      color: #333;
    }

    /* ── LISTA MÚLTIPLE temas ── */
    select.temas {
      width: 100%;
      max-width: 360px;
      height: 120px;
      border: 1px solid #aaa;
      font-size: 0.88rem;
      padding: 2px;
    }

    /* ── BOTONES ── */
    .botones {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    input[type="submit"],
    input[type="reset"] {
      padding: 7px 22px;
      font-size: 0.9rem;
      border: 1px solid #888;
      background-color: #e0e0e0;
      cursor: pointer;
      border-radius: 2px;
    }

    input[type="submit"]:hover { background-color: #c8c8c8; }
    input[type="reset"]:hover  { background-color: #c8c8c8; }

    p.alumno {
      font-size: 0.78rem;
      color: #555;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <h1>Rellena tu CV</h1>

  <form method="get" action="#">

    <!-- ══ DATOS PERSONALES ══ -->
    <fieldset>
      <legend>Datos personales</legend>

      <!-- Provincia -->
      <label class="titulo">Provincia</label>
      <select name="provincia" class="provincia">
        <option value="">- selecciona -</option>
        <option value="amazonas">Amazonas</option>
        <option value="ancash">Áncash</option>
        <option value="apurimac">Apurímac</option>
        <option value="arequipa">Arequipa</option>
        <option value="ayacucho">Ayacucho</option>
        <option value="cajamarca">Cajamarca</option>
        <option value="callao">Callao</option>
        <option value="cusco">Cusco</option>
        <option value="huancavelica">Huancavelica</option>
        <option value="huanuco">Huánuco</option>
        <option value="ica">Ica</option>
        <option value="junin">Junín</option>
        <option value="lalibertad">La Libertad</option>
        <option value="lambayeque">Lambayeque</option>
        <option value="lima">Lima</option>
        <option value="loreto">Loreto</option>
        <option value="madrededios">Madre de Dios</option>
        <option value="moquegua">Moquegua</option>
        <option value="pasco">Pasco</option>
        <option value="piura">Piura</option>
        <option value="puno">Puno</option>
        <option value="sanmartin">San Martín</option>
        <option value="tacna">Tacna</option>
        <option value="tumbes">Tumbes</option>
        <option value="ucayali">Ucayali</option>
      </select>

      <!-- Fecha de nacimiento -->
      <label class="titulo">Fecha de nacimiento</label>
      <div class="fecha-row">
        <input type="text" name="dia" maxlength="2" placeholder="DD">
        <span>de</span>
        <select name="mes">
          <option value="1">Enero</option>
          <option value="2">Febrero</option>
          <option value="3">Marzo</option>
          <option value="4">Abril</option>
          <option value="5">Mayo</option>
          <option value="6">Junio</option>
          <option value="7">Julio</option>
          <option value="8">Agosto</option>
          <option value="9">Septiembre</option>
          <option value="10">Octubre</option>
          <option value="11">Noviembre</option>
          <option value="12">Diciembre</option>
        </select>
        <span>de</span>
        <input type="text" name="anio" maxlength="4" placeholder="AAAA">
      </div>

      <!-- Temas de interés -->
      <label class="titulo">Temas de interés</label>
      <select name="temas" class="temas" multiple size="5">
        <option value="bbdd">Administración de bases de datos</option>
        <option value="prog">Análisis y programación</option>
        <option value="arq">Arquitectura</option>
        <option value="cal">Calidad</option>
        <option value="erp">ERP, CRM, Business Intelligence</option>
        <option value="redes">Redes y telecomunicaciones</option>
        <option value="ia">Inteligencia Artificial</option>
        <option value="web">Desarrollo Web</option>
        <option value="seguridad">Seguridad informática</option>
        <option value="steam">Educación STEAM</option>
      </select>

    </fieldset>

    <!-- ══ BOTONES ══ -->
    <div class="botones">
      <input type="submit" value="Enviar CV">
      <input type="reset"  value="Limpiar">
    </div>

  </form>

  <p class="alumno">
    Programado por: <strong>Sheila Sierralta Pinedo</strong> &nbsp;|&nbsp;
    Diseño de Páginas Web y Portales Educativos – UPRIT 2026
  </p>

</body>
</html>
